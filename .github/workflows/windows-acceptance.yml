name: Windows release acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bridges/multi-web2api/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache-dependency-path: bridges/gemini-web2api/go.sum
      - name: Install locked dependencies
        run: npm ci
      - name: Install the locked website bridge driver
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --prefix bridges/multi-web2api
      - name: Check the portable Windows release
        env:
          GOTOOLCHAIN: local
        run: node scripts/release-check.mjs
      - name: Keep development artifacts and diagnostic fixtures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Gravity-Windows-development-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            release/Gravity-*-x64.exe
            release/Gravity-*-source.zip
            release/SHA256SUMS-*.txt
            artifacts/*.png
